name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type and framework checks
        run: bun run check
      - name: Tests
        run: bun run test
      - name: Formatting
        run: bun run format:check
      - name: Production builds
        run: bun run build
