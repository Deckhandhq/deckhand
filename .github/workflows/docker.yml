name: Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: API metadata
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/deckhand-api
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Web metadata
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/deckhand-web
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release with stack files
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            docker-compose.yml
            .env.example
            Caddyfile

  smoke:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute image version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Prepare stack
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          sed -i 's/"80:80"/"8080:80"/; s/"443:443"/"8443:443"/; s/127.0.0.1:5432:5432/127.0.0.1:15432:5432/' docker-compose.yml
          cp .env.example .env
          sed -i \
            -e 's|^DOMAIN=.*|DOMAIN=localhost|' \
            -e 's|^ORIGIN=.*|ORIGIN=https://localhost:8443|' \
            -e 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=change-me|' \
            -e 's|^DATABASE_URL=.*|DATABASE_URL="postgresql://deckhand:change-me@localhost:15432/deckhand?schema=public"|' \
            -e "s|^DECKHAND_VERSION=.*|DECKHAND_VERSION=$VERSION|" \
            .env
      - name: Start stack from published images
        run: docker compose up -d
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -skf https://localhost:8443/api/health > /dev/null; then
              echo "stack healthy"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs api web caddy
          exit 1
