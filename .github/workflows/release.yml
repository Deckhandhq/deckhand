name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dekhand-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/dekhand-api:latest

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dekhand-web:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/dekhand-web:latest
