name: dekhand

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dekhand}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-dekhand}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dekhand}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  migrate:
    image: ghcr.io/CHANGEME/dekhand-api:${DEKHAND_VERSION:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dekhand}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dekhand}
    command: ["bunx", "prisma", "migrate", "deploy"]
    networks: [internal]

  api:
    image: ghcr.io/CHANGEME/dekhand-api:${DEKHAND_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dekhand}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dekhand}
      PORT: "3000"
      HOST: 0.0.0.0
    expose: ["3000"]
    networks: [internal]

  web:
    image: ghcr.io/CHANGEME/dekhand-web:${DEKHAND_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: "3000"
      HOST: 0.0.0.0
      PUBLIC_API_URL: /api
      INTERNAL_API_URL: http://api:3000
    expose: ["3000"]
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DEKHAND_DOMAIN: ${DEKHAND_DOMAIN:?DEKHAND_DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
