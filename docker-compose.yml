# Deckhand — single-file stack
# Edit every `change-me` below and set ORIGIN / DOMAIN to your public URL.
#
#   docker compose up -d                   # core only — bring your own proxy
#   docker compose --profile proxy up -d   # with Caddy (recommended)

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: deckhand
      POSTGRES_USER: deckhand
      POSTGRES_PASSWORD: change-me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U deckhand -d deckhand
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: epitexam/deckhand-api:0.1.2
    restart: unless-stopped
    init: true
    cpus: 1.0
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: postgresql://deckhand:change-me@postgres:5432/deckhand?schema=public
      NODE_ENV: production
      PORT: 3000
      BETTER_AUTH_SECRET: change-me
      BETTER_AUTH_URL: https://example.com
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: epitexam/deckhand-web:0.1.2
    restart: unless-stopped
    init: true
    cpus: 1.0
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ORIGIN: https://example.com
      API_INTERNAL_URL: http://api:3000
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["proxy"]
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DOMAIN: example.com
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

# `$$` is a Compose escape: Caddy receives {$DOMAIN:localhost}.
configs:
  caddyfile:
    content: |
      {$$DOMAIN:localhost} {
        handle_path /api/* {
          reverse_proxy api:3000
        }

        handle {
          reverse_proxy web:3000
        }
      }

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
